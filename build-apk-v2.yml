name: Build Stadium Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find source package
        id: source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'StadiumMobileNative-v0.3-build-ready*.zip' -printf '%f\n' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No StadiumMobileNative-v0.3-build-ready*.zip file found in repository root."
            exit 1
          fi
          echo "Using source package: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.source.outputs.zip_file }}" -d project
          echo "Extracted project contents:"
          find project -maxdepth 2 -type f | sort | head -n 50

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Gradle project
        id: gradle_project
        shell: bash
        run: |
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            PROJECT_DIR="project"
          else
            SETTINGS_FILE="$(find project -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "Could not locate settings.gradle or settings.gradle.kts after extraction."
              find project -maxdepth 3 -type f | sort
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "Gradle project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build installable debug APK
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.gradle_project.outputs.project_dir }}/app/build/outputs/apk/debug" -type f -name '*debug*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "Debug APK was not found."
            exit 1
          fi
          cp "$APK_FILE" Stadium-Mobile-Lab-v0.3.1.apk
          ls -lh Stadium-Mobile-Lab-v0.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stadium-Mobile-Lab-v0.3.1-APK
          path: Stadium-Mobile-Lab-v0.3.1.apk
          if-no-files-found: error
