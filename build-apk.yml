name: Build Stadium Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source package
        run: test -f StadiumMobileNative-v0.3-build-ready.zip

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q StadiumMobileNative-v0.3-build-ready.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Stadium-Mobile-Lab-v0.3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stadium-Mobile-Lab-v0.3.0-APK
          path: Stadium-Mobile-Lab-v0.3.0.apk
          if-no-files-found: error
