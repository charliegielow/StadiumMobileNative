name: Build Stadium Mobile APK v5 AAudio Ultra Low Latency

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate v0.4 Android source ZIP
        id: source
        shell: bash
        run: |
          echo "Files in repository root:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'StadiumMobileNative-v0.4*.zip' -printf '%f\n' | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No StadiumMobileNative-v0.4*.zip exists in the repository root."
            exit 1
          fi
          echo "Using source package: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "${{ steps.source.outputs.zip_file }}" -d project
          test -f project/settings.gradle || test -f project/settings.gradle.kts
          test -f project/app/build.gradle || test -f project/app/build.gradle.kts
          test -f project/app/src/main/cpp/CMakeLists.txt
          test -f project/app/src/main/cpp/native_audio.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native AAudio debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK_FILE="$(find project/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi
          cp "$APK_FILE" Stadium-Mobile-Lab-v0.4.0-AAudio-Ultra-Low-Latency.apk
          ls -lh Stadium-Mobile-Lab-v0.4.0-AAudio-Ultra-Low-Latency.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Stadium-Mobile-Lab-v0.4.0-AAudio-Ultra-Low-Latency-APK
          path: Stadium-Mobile-Lab-v0.4.0-AAudio-Ultra-Low-Latency.apk
          if-no-files-found: error
